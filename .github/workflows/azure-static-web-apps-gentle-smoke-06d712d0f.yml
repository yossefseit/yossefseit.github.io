name: Validate and deploy Azure Static Web App

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: static-web-app-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event.action != 'closed'
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run dependency-free site checks
        run: python3 scripts/validate_site.py
      - name: Check JavaScript syntax
        run: node --check assets/site.js
      - name: Validate HTML semantics
        run: >-
          npx --yes html-validate@11.6.2
          index.html
          404.html
          projects/index.html
          projects/azure-governance-automation/index.html
          projects/azure-secure-hub-spoke/index.html
          projects/samba-ad-dc-lab/index.html
      - name: Validate CSS syntax
        run: npx --yes csstree-validator@4.0.1 assets/site.css
      - name: Compile Bicep resource definition
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
      - name: Check spelling
        run: npx --yes cspell@10.0.1 --config .cspell.json "**/*.{html,md}"
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_deploy_job:
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    needs: validate
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Request GitHub identity token
        id: idtoken
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Upload static site
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_SMOKE_06D712D0F }}
          # The action runtime consumes this OIDC token even though its action.yml
          # does not declare the input and GitHub emits an annotation.
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: /
          api_location: ""
          output_location: ""
          skip_app_build: true
